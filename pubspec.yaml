name: angel_messages
description: A spiritual messaging app delivering daily angel-themed inspirational notifications
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management & DI
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # Routing & navigation
  go_router: ^13.0.0
  
  # HTTP client
  dio: ^5.4.0
  
  # Local storage
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  
  # Notifications
  flutter_local_notifications: ^16.0.0
  timezone: ^0.9.0
  flutter_timezone: ^1.0.0
  permission_handler: ^11.0.0
  
  # Background tasks
  workmanager: ^0.5.0
  
  # Data models
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  
  # UI & design
  google_fonts: ^6.1.0
  gap: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code generation
  build_runner: ^2.4.0
  freezed: ^2.4.0
  riverpod_generator: ^2.3.0
  json_serializable: ^6.7.0
  
  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
